services:
  server:
    image: ghcr.io/${GHCR_NAMESPACE}/bishe-server:${APP_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8080"
    # docker compose --env-file 只负责变量替换；后端容器真正可见的配置必须在这里显式注入。
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: "8080"
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-120}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      AUTH_CAPTCHA_GEETEST_ENABLED: ${AUTH_CAPTCHA_GEETEST_ENABLED:-false}
      AUTH_CAPTCHA_GEETEST_CAPTCHA_ID: ${AUTH_CAPTCHA_GEETEST_CAPTCHA_ID:-}
      AUTH_CAPTCHA_GEETEST_CAPTCHA_KEY: ${AUTH_CAPTCHA_GEETEST_CAPTCHA_KEY:-}
      AUTH_CAPTCHA_GEETEST_VERIFY_URL: ${AUTH_CAPTCHA_GEETEST_VERIFY_URL:-https://gcaptcha4.geetest.com/validate}
      AUTH_CAPTCHA_GEETEST_TIMEOUT_MS: ${AUTH_CAPTCHA_GEETEST_TIMEOUT_MS:-5000}
      AUTH_CAPTCHA_GEETEST_PROOF_TTL_SECONDS: ${AUTH_CAPTCHA_GEETEST_PROOF_TTL_SECONDS:-600}
      AUTH_EMAIL_RESEND_API_KEY: ${AUTH_EMAIL_RESEND_API_KEY:-}
      AUTH_EMAIL_RESEND_FROM_EMAIL: ${AUTH_EMAIL_RESEND_FROM_EMAIL:-}
      AUTH_EMAIL_RESEND_API_URL: ${AUTH_EMAIL_RESEND_API_URL:-https://api.resend.com/emails}
      AUTH_EMAIL_CODE_TTL_SECONDS: ${AUTH_EMAIL_CODE_TTL_SECONDS:-600}
      AUTH_EMAIL_RESEND_COOLDOWN_SECONDS: ${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_EMAIL_PROOF_TTL_SECONDS: ${AUTH_EMAIL_PROOF_TTL_SECONDS:-1800}
      ADMIN_INIT_EMAIL: ${ADMIN_INIT_EMAIL}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      ADMIN_INIT_DISPLAY_NAME: ${ADMIN_INIT_DISPLAY_NAME:-系统管理员}
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-MOCK}
      AI_GATEWAY_CONFIG_SECRET: ${AI_GATEWAY_CONFIG_SECRET}
      AI_GATEWAY_ALLOW_LEGACY_FALLBACK: ${AI_GATEWAY_ALLOW_LEGACY_FALLBACK:-true}
      AI_GATEWAY_DEBUG_ENABLED: ${AI_GATEWAY_DEBUG_ENABLED:-false}
      AI_GATEWAY_AI_REQUEST_LOG_ENABLED: ${AI_GATEWAY_AI_REQUEST_LOG_ENABLED:-false}
      AI_INTERVIEW_MAX_REPLY_ROUNDS: ${AI_INTERVIEW_MAX_REPLY_ROUNDS:-30}
      AI_INTERVIEW_RESERVED_QUOTA_WEIGHT: ${AI_INTERVIEW_RESERVED_QUOTA_WEIGHT:-5}
      AI_TTS_CACHE_ENABLED: ${AI_TTS_CACHE_ENABLED:-true}
      AI_TTS_CACHE_TTL_SECONDS: ${AI_TTS_CACHE_TTL_SECONDS:-1800}
      PAYMENT_MODE: ${PAYMENT_MODE:-MOCK}
      PAYMENT_UNPAID_TIMEOUT_MINUTES: ${PAYMENT_UNPAID_TIMEOUT_MINUTES:-30}
      PAYMENT_SANDBOX_PAY_BASE_URL: ${PAYMENT_SANDBOX_PAY_BASE_URL:-}
      PAYMENT_SANDBOX_GATEWAY_URL: ${PAYMENT_SANDBOX_GATEWAY_URL:-}
      PAYMENT_SANDBOX_APP_ID: ${PAYMENT_SANDBOX_APP_ID:-}
      PAYMENT_SANDBOX_APP_PRIVATE_KEY: ${PAYMENT_SANDBOX_APP_PRIVATE_KEY:-}
      PAYMENT_SANDBOX_APP_PRIVATE_KEY_BASE64: ${PAYMENT_SANDBOX_APP_PRIVATE_KEY_BASE64:-}
      PAYMENT_SANDBOX_APP_PRIVATE_KEY_PATH: ${PAYMENT_SANDBOX_APP_PRIVATE_KEY_PATH:-}
      PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY: ${PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY:-}
      PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY_BASE64: ${PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY_BASE64:-}
      PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY_PATH: ${PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY_PATH:-}
      PAYMENT_SANDBOX_NOTIFY_URL: ${PAYMENT_SANDBOX_NOTIFY_URL:-}
      PAYMENT_SANDBOX_RETURN_URL: ${PAYMENT_SANDBOX_RETURN_URL:-}
      PAYMENT_SANDBOX_VERIFY_ENABLED: ${PAYMENT_SANDBOX_VERIFY_ENABLED:-false}
      PAYMENT_SANDBOX_SIGN_TYPE: ${PAYMENT_SANDBOX_SIGN_TYPE:-RSA2}
      PAYMENT_SANDBOX_CHARSET: ${PAYMENT_SANDBOX_CHARSET:-utf-8}
      PAYMENT_SANDBOX_SUBJECT_PREFIX: ${PAYMENT_SANDBOX_SUBJECT_PREFIX:-职业规划咨询}
      PAYMENT_SANDBOX_TIMEOUT_EXPRESS: ${PAYMENT_SANDBOX_TIMEOUT_EXPRESS:-30m}
      PAYMENT_SANDBOX_PRODUCT_CODE: ${PAYMENT_SANDBOX_PRODUCT_CODE:-FAST_INSTANT_TRADE_PAY}
      AI_PROVIDER_KEY: ${AI_PROVIDER_KEY:-openai-compatible}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4o-mini}
      AI_PROVIDER_STT_MODEL: ${AI_PROVIDER_STT_MODEL:-gpt-4o-mini}
      AI_PROVIDER_TTS_MODEL: ${AI_PROVIDER_TTS_MODEL:-}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-15000}
      AI_PROVIDER_MAX_RETRIES: ${AI_PROVIDER_MAX_RETRIES:-1}
      AI_PROVIDER_COST_PER_1K_INPUT: ${AI_PROVIDER_COST_PER_1K_INPUT:-0}
      AI_PROVIDER_COST_PER_1K_OUTPUT: ${AI_PROVIDER_COST_PER_1K_OUTPUT:-0}
      AI_PROVIDER_TEMPERATURE: ${AI_PROVIDER_TEMPERATURE:-0.2}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-bishe-assets}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
      CERTIFICATION_MAX_FILE_SIZE_BYTES: ${CERTIFICATION_MAX_FILE_SIZE_BYTES:-10485760}
      CONSULT_MENTOR_REPLY_TIMEOUT_HOURS: ${CONSULT_MENTOR_REPLY_TIMEOUT_HOURS:-24}
      CONSULT_MENTOR_REPLY_RECLAIM_FIXED_DELAY_MS: ${CONSULT_MENTOR_REPLY_RECLAIM_FIXED_DELAY_MS:-60000}
      NOTIFICATION_APP_BASE_URL: ${NOTIFICATION_APP_BASE_URL:-}
      NOTIFICATION_DISPATCH_BATCH_SIZE: ${NOTIFICATION_DISPATCH_BATCH_SIZE:-8}
      NOTIFICATION_DISPATCH_LEASE_MS: ${NOTIFICATION_DISPATCH_LEASE_MS:-30000}
      NOTIFICATION_DISPATCH_POLL_INTERVAL_MS: ${NOTIFICATION_DISPATCH_POLL_INTERVAL_MS:-2000}
      NOTIFICATION_DISPATCH_RETENTION_ENABLED: ${NOTIFICATION_DISPATCH_RETENTION_ENABLED:-true}
      NOTIFICATION_DISPATCH_RETENTION_MAX_AGE_MS: ${NOTIFICATION_DISPATCH_RETENTION_MAX_AGE_MS:-2592000000}
      NOTIFICATION_DISPATCH_RETENTION_BATCH_SIZE: ${NOTIFICATION_DISPATCH_RETENTION_BATCH_SIZE:-200}
      NOTIFICATION_DISPATCH_RETENTION_INITIAL_DELAY_MS: ${NOTIFICATION_DISPATCH_RETENTION_INITIAL_DELAY_MS:-3600000}
      NOTIFICATION_DISPATCH_RETENTION_FIXED_DELAY_MS: ${NOTIFICATION_DISPATCH_RETENTION_FIXED_DELAY_MS:-3600000}
      NOTIFICATION_WS_TICKET_TTL_SECONDS: ${NOTIFICATION_WS_TICKET_TTL_SECONDS:-180}
      NOTIFICATION_EMAIL_RESEND_API_KEY: ${NOTIFICATION_EMAIL_RESEND_API_KEY:-${AUTH_EMAIL_RESEND_API_KEY:-}}
      NOTIFICATION_EMAIL_RESEND_FROM_EMAIL: ${NOTIFICATION_EMAIL_RESEND_FROM_EMAIL:-${AUTH_EMAIL_RESEND_FROM_EMAIL:-}}
      NOTIFICATION_EMAIL_RESEND_API_URL: ${NOTIFICATION_EMAIL_RESEND_API_URL:-${AUTH_EMAIL_RESEND_API_URL:-https://api.resend.com/emails}}
      MENTOR_RECOMMENDATION_RETENTION_ENABLED: ${MENTOR_RECOMMENDATION_RETENTION_ENABLED:-true}
      MENTOR_RECOMMENDATION_RETENTION_MAX_AGE_MS: ${MENTOR_RECOMMENDATION_RETENTION_MAX_AGE_MS:-2592000000}
      MENTOR_RECOMMENDATION_RETENTION_BATCH_SIZE: ${MENTOR_RECOMMENDATION_RETENTION_BATCH_SIZE:-500}
      MENTOR_RECOMMENDATION_RETENTION_INITIAL_DELAY_MS: ${MENTOR_RECOMMENDATION_RETENTION_INITIAL_DELAY_MS:-3600000}
      MENTOR_RECOMMENDATION_RETENTION_FIXED_DELAY_MS: ${MENTOR_RECOMMENDATION_RETENTION_FIXED_DELAY_MS:-3600000}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
    networks:
      - bishe_prod

  interview-live:
    image: ghcr.io/${GHCR_NAMESPACE}/bishe-interview-live:${APP_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8765"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INTERVIEW_LIVE_MODEL: ${INTERVIEW_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      INTERVIEW_LIVE_VOICE: ${INTERVIEW_LIVE_VOICE:-Kore}
      INTERVIEW_LIVE_HOST: 0.0.0.0
      INTERVIEW_LIVE_PORT: ${INTERVIEW_LIVE_PORT:-8765}
      INTERVIEW_LIVE_WS_PATH: ${INTERVIEW_LIVE_WS_PATH:-/ai/interview/live/ws}
      INTERVIEW_LIVE_HEALTH_PATH: ${INTERVIEW_LIVE_HEALTH_PATH:-/ai/interview/live/healthz}
      INTERVIEW_LIVE_LOG_LEVEL: ${INTERVIEW_LIVE_LOG_LEVEL:-INFO}
    networks:
      - bishe_prod

  web:
    image: ghcr.io/${GHCR_NAMESPACE}/bishe-web:${APP_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - bishe_prod

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
      - server
      - interview-live
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_TLS_EMAIL: ${APP_TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - bishe_caddy_data:/data
      - bishe_caddy_config:/config
    networks:
      - bishe_prod

volumes:
  bishe_caddy_data:
  bishe_caddy_config:

networks:
  bishe_prod:
    external: true
