server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  config:
    import:
      - optional:file:../../.env[.properties]
  application:
    name: server-java
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/bishe}
    username: ${DB_USERNAME:bishe}
    password: ${DB_PASSWORD:bishe}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration-pg
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

auth:
  jwt:
    secret: ${JWT_SECRET:bishe-auth-secret-key-with-at-least-32-chars}
    access-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
    refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  captcha:
    geetest:
      enabled: ${AUTH_CAPTCHA_GEETEST_ENABLED:false}
      captcha-id: ${AUTH_CAPTCHA_GEETEST_CAPTCHA_ID:}
      captcha-key: ${AUTH_CAPTCHA_GEETEST_CAPTCHA_KEY:}
      verify-url: ${AUTH_CAPTCHA_GEETEST_VERIFY_URL:https://gcaptcha4.geetest.com/validate}
      timeout-ms: ${AUTH_CAPTCHA_GEETEST_TIMEOUT_MS:5000}
      proof-ttl-seconds: ${AUTH_CAPTCHA_GEETEST_PROOF_TTL_SECONDS:600}
  email:
    resend-api-key: ${AUTH_EMAIL_RESEND_API_KEY:}
    resend-from-email: ${AUTH_EMAIL_RESEND_FROM_EMAIL:}
    resend-api-url: ${AUTH_EMAIL_RESEND_API_URL:https://api.resend.com/emails}
    code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS:600}
    resend-cooldown-seconds: ${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:60}
    proof-ttl-seconds: ${AUTH_EMAIL_PROOF_TTL_SECONDS:1800}
  admin:
    email: ${ADMIN_INIT_EMAIL:admin@bishe.local}
    password: ${ADMIN_INIT_PASSWORD:Passw0rd!}
    display-name: ${ADMIN_INIT_DISPLAY_NAME:系统管理员}

demo:
  enabled: ${DEMO_MODE_ENABLED:false}
  auth:
    register-skip-email-verification: ${DEMO_AUTH_REGISTER_SKIP_EMAIL_VERIFICATION:false}
    fixed-email-code: ${DEMO_AUTH_FIXED_EMAIL_CODE:000000}

storage:
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minio123}
    bucket: ${MINIO_BUCKET:bishe-assets}

certification:
  max-file-size-bytes: ${CERTIFICATION_MAX_FILE_SIZE_BYTES:10485760}

ai:
  interview:
    max-reply-rounds: ${AI_INTERVIEW_MAX_REPLY_ROUNDS:30}
    reserved-quota-weight: ${AI_INTERVIEW_RESERVED_QUOTA_WEIGHT:5}
  tts:
    cache:
      enabled: ${AI_TTS_CACHE_ENABLED:true}
      ttl-seconds: ${AI_TTS_CACHE_TTL_SECONDS:1800}
  gateway:
    mode: ${AI_GATEWAY_MODE:MOCK}
    config-secret: ${AI_GATEWAY_CONFIG_SECRET:}
    allow-legacy-fallback: ${AI_GATEWAY_ALLOW_LEGACY_FALLBACK:true}
    logging:
      debug-enabled: ${AI_GATEWAY_DEBUG_ENABLED:false}
      ai-request-log-enabled: ${AI_GATEWAY_AI_REQUEST_LOG_ENABLED:false}
    openai-compatible:
      provider-key: ${AI_PROVIDER_KEY:openai-compatible}
      base-url: ${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_PROVIDER_API_KEY:}
      default-model: ${AI_PROVIDER_MODEL:gpt-4o-mini}
      speech-to-text-model: ${AI_PROVIDER_STT_MODEL:${AI_PROVIDER_MODEL:gpt-4o-mini}}
      text-to-speech-model: ${AI_PROVIDER_TTS_MODEL:}
      timeout-ms: ${AI_PROVIDER_TIMEOUT_MS:15000}
      max-retries: ${AI_PROVIDER_MAX_RETRIES:1}
      cost-per-1k-input: ${AI_PROVIDER_COST_PER_1K_INPUT:0}
      cost-per-1k-output: ${AI_PROVIDER_COST_PER_1K_OUTPUT:0}
      temperature: ${AI_PROVIDER_TEMPERATURE:0.2}

payment:
  mode: ${PAYMENT_MODE:MOCK}
  unpaid-timeout-minutes: ${PAYMENT_UNPAID_TIMEOUT_MINUTES:30}
  sandbox:
    pay-base-url: ${PAYMENT_SANDBOX_PAY_BASE_URL:}
    gateway-url: ${PAYMENT_SANDBOX_GATEWAY_URL:}
    app-id: ${PAYMENT_SANDBOX_APP_ID:}
    app-private-key: ${PAYMENT_SANDBOX_APP_PRIVATE_KEY:}
    app-private-key-base64: ${PAYMENT_SANDBOX_APP_PRIVATE_KEY_BASE64:}
    app-private-key-path: ${PAYMENT_SANDBOX_APP_PRIVATE_KEY_PATH:}
    verify-enabled: ${PAYMENT_SANDBOX_VERIFY_ENABLED:false}
    alipay-public-key: ${PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY:}
    alipay-public-key-base64: ${PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY_BASE64:}
    alipay-public-key-path: ${PAYMENT_SANDBOX_ALIPAY_PUBLIC_KEY_PATH:}
    sign-type: ${PAYMENT_SANDBOX_SIGN_TYPE:RSA2}
    notify-url: ${PAYMENT_SANDBOX_NOTIFY_URL:}
    return-url: ${PAYMENT_SANDBOX_RETURN_URL:}
    charset: ${PAYMENT_SANDBOX_CHARSET:utf-8}
    subject-prefix: ${PAYMENT_SANDBOX_SUBJECT_PREFIX:职业规划咨询}
    timeout-express: ${PAYMENT_SANDBOX_TIMEOUT_EXPRESS:30m}
    product-code: ${PAYMENT_SANDBOX_PRODUCT_CODE:FAST_INSTANT_TRADE_PAY}

consult:
  mentor-reply-timeout-hours: ${CONSULT_MENTOR_REPLY_TIMEOUT_HOURS:24}
  mentor-reply-reclaim-fixed-delay-ms: ${CONSULT_MENTOR_REPLY_RECLAIM_FIXED_DELAY_MS:60000}

notification:
  app-base-url: ${NOTIFICATION_APP_BASE_URL:}
  dispatch:
    batch-size: ${NOTIFICATION_DISPATCH_BATCH_SIZE:8}
    lease-ms: ${NOTIFICATION_DISPATCH_LEASE_MS:30000}
    poll-interval-ms: ${NOTIFICATION_DISPATCH_POLL_INTERVAL_MS:2000}
    retention:
      enabled: ${NOTIFICATION_DISPATCH_RETENTION_ENABLED:true}
      max-age-ms: ${NOTIFICATION_DISPATCH_RETENTION_MAX_AGE_MS:2592000000}
      batch-size: ${NOTIFICATION_DISPATCH_RETENTION_BATCH_SIZE:200}
      initial-delay-ms: ${NOTIFICATION_DISPATCH_RETENTION_INITIAL_DELAY_MS:3600000}
      fixed-delay-ms: ${NOTIFICATION_DISPATCH_RETENTION_FIXED_DELAY_MS:3600000}
  websocket:
    ticket-ttl-seconds: ${NOTIFICATION_WS_TICKET_TTL_SECONDS:180}
  email:
    resend-api-key: ${NOTIFICATION_EMAIL_RESEND_API_KEY:${AUTH_EMAIL_RESEND_API_KEY:}}
    resend-from-email: ${NOTIFICATION_EMAIL_RESEND_FROM_EMAIL:${AUTH_EMAIL_RESEND_FROM_EMAIL:}}
    resend-api-url: ${NOTIFICATION_EMAIL_RESEND_API_URL:${AUTH_EMAIL_RESEND_API_URL:https://api.resend.com/emails}}

mentor:
  recommendation:
    retention:
      enabled: ${MENTOR_RECOMMENDATION_RETENTION_ENABLED:true}
      max-age-ms: ${MENTOR_RECOMMENDATION_RETENTION_MAX_AGE_MS:2592000000}
      batch-size: ${MENTOR_RECOMMENDATION_RETENTION_BATCH_SIZE:500}
      initial-delay-ms: ${MENTOR_RECOMMENDATION_RETENTION_INITIAL_DELAY_MS:3600000}
      fixed-delay-ms: ${MENTOR_RECOMMENDATION_RETENTION_FIXED_DELAY_MS:3600000}
